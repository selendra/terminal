specVersion: 1.0.0
name: selendra-unified-indexer
version: 1.0.0
runner:
  node:
    name: "@subql/node"
    version: ">=5.0.0"
  query:
    name: "@subql/query"
    version: "*"
description: >-
  Minimal indexer for fast initial sync - blocks only.
  Switch to project-full.yaml after sync is complete.
repository: https://github.com/selendra/selendra-terminal
schema:
  file: ./schema.graphql

network:
  chainId: "0x536274806b33f992898c98f2ad4fe6e190057900fcd8505083e3b765790b4bed"
  endpoint:
    - http://selendra-node:9944

dataSources:
  - kind: substrate/Runtime
    startBlock: 1
    mapping:
      file: ./dist/index.js
      handlers:
        # Block handler only - process every 5000th block
        - handler: handleBlock
          kind: substrate/BlockHandler
          filter:
            modulo: 5000
