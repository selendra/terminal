specVersion: 1.0.0
name: selendra-unified-indexer
version: 1.0.0
runner:
  node:
    name: "@subql/node"
    version: ">=5.0.0"
  query:
    name: "@subql/query"
    version: "*"
description: >-
  Unified indexer for Selendra Terminal - indexes both Substrate extrinsics/events 
  and EVM transactions for a unified dual-VM experience
repository: https://github.com/selendra/selendra-terminal
schema:
  file: ./schema.graphql

network:
  # Selendra mainnet genesis hash
  chainId: "0x536274806b33f992898c98f2ad4fe6e190057900fcd8505083e3b765790b4bed"
  # Default endpoint - can be overridden by --network-endpoint flag in docker-compose
  endpoint:
    - wss://rpc.selendra.org
    # For local development, use: ws://selendra-node:9944 (set via --network-endpoint)
  # Uncomment for testnet
  # chainId: "0x..."
  # endpoint:
  #   - wss://rpc-testnet.selendra.org
  # Custom chain types disabled - using runtime metadata
  # chaintypes:
  #   file: ./chaintypes.yaml

dataSources:
  # ============================================
  # SUBSTRATE DATA SOURCE
  # ============================================
  - kind: substrate/Runtime
    startBlock: 1
    mapping:
      file: ./dist/index.js
      handlers:
        # Block handler for block metadata
        - handler: handleBlock
          kind: substrate/BlockHandler
          filter:
            modulo: 100 # Process every 100th block for stats

        # Extrinsic handlers
        - handler: handleExtrinsic
          kind: substrate/CallHandler
          filter:
            module: "*"
            method: "*"

        # Balance transfer events
        - handler: handleBalanceTransfer
          kind: substrate/EventHandler
          filter:
            module: balances
            method: Transfer

        # EVM execution events (from pallet-ethereum)
        - handler: handleEvmExecuted
          kind: substrate/EventHandler
          filter:
            module: ethereum
            method: Executed

        # Staking events
        - handler: handleStakingBonded
          kind: substrate/EventHandler
          filter:
            module: staking
            method: Bonded

        - handler: handleStakingUnbonded
          kind: substrate/EventHandler
          filter:
            module: staking
            method: Unbonded

        - handler: handleStakingRewarded
          kind: substrate/EventHandler
          filter:
            module: staking
            method: Rewarded

        # Governance events
        - handler: handleDemocracyProposed
          kind: substrate/EventHandler
          filter:
            module: democracy
            method: Proposed

        - handler: handleDemocracyVoted
          kind: substrate/EventHandler
          filter:
            module: democracy
            method: Voted

        # Unified accounts events
        - handler: handleAccountClaimed
          kind: substrate/EventHandler
          filter:
            module: unifiedAccounts
            method: AccountClaimed

        # Identity events
        - handler: handleIdentitySet
          kind: substrate/EventHandler
          filter:
            module: identity
            method: IdentitySet

        - handler: handleIdentityCleared
          kind: substrate/EventHandler
          filter:
            module: identity
            method: IdentityCleared

  # ============================================
  # EVM/FRONTIER DATA SOURCE
  # ============================================
  - kind: substrate/FrontierEvm
    startBlock: 1
    processor:
      file: ./node_modules/@subql/frontier-evm-processor/dist/bundle.js
      options:
        abi: erc20
        address: null # Track all contracts
    assets:
      erc20:
        file: ./abis/erc20.json
      erc721:
        file: ./abis/erc721.json
      erc1155:
        file: ./abis/erc1155.json
    mapping:
      file: ./dist/index.js
      handlers:
        # EVM Transaction handler
        - handler: handleEvmTransaction
          kind: substrate/FrontierEvmCall
          filter:
            function: null # All function calls

        # ERC-20 Transfer events
        - handler: handleErc20Transfer
          kind: substrate/FrontierEvmEvent
          filter:
            topics:
              - "Transfer(address indexed from, address indexed to, uint256 value)"

        # ERC-721 Transfer events
        - handler: handleErc721Transfer
          kind: substrate/FrontierEvmEvent
          filter:
            topics:
              - "Transfer(address indexed from, address indexed to, uint256 indexed tokenId)"

        # ERC-1155 Transfer events
        - handler: handleErc1155TransferSingle
          kind: substrate/FrontierEvmEvent
          filter:
            topics:
              - "TransferSingle(address indexed operator, address indexed from, address indexed to, uint256 id, uint256 value)"

        - handler: handleErc1155TransferBatch
          kind: substrate/FrontierEvmEvent
          filter:
            topics:
              - "TransferBatch(address indexed operator, address indexed from, address indexed to, uint256[] ids, uint256[] values)"
