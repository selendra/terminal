specVersion: 1.0.0
name: selendra-fast-sync
version: 1.0.0
runner:
  node:
    name: "@subql/node"
    version: ">=5.0.0"
  query:
    name: "@subql/query"
    version: "*"
description: >-
  Ultra-fast sync - blocks only, no events. Switch to project.yaml after sync.
repository: https://github.com/selendra/selendra-terminal
schema:
  file: ./schema.graphql

network:
  chainId: "0x536274806b33f992898c98f2ad4fe6e190057900fcd8505083e3b765790b4bed"
  endpoint:
    - ws://selendra-node:9944

dataSources:
  - kind: substrate/Runtime
    startBlock: 1
    mapping:
      file: ./dist/index.js
      handlers:
        # Only block stats every 10000 blocks for fastest sync
        - handler: handleBlock
          kind: substrate/BlockHandler
          filter:
            modulo: 10000
