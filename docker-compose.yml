# Selendra Terminal - Production Docker Compose
# Full stack: Selendra Node + Indexer + GraphQL API + Explorer
#
# Architecture:
#   Selendra Node (archive) → SubQuery Indexer → PostgreSQL → GraphQL API → Explorer
#
# Speed Comparison:
#   Public RPC: ~10 blocks/s + frequent disconnections
#   Local Node: 3,000-18,000 blocks/s (stable)
#
# Usage:
#   docker-compose up -d                    # Start full stack
#   docker-compose --profile standalone up -d  # Explorer only (public RPC)
#   docker-compose logs -f                  # View logs
#   docker-compose down                     # Stop all services
#   docker-compose down -v                  # Stop and remove volumes
#
# Initial Sync Strategy (Two-Phase):
#   Phase 1: Fast sync with modulo 5000 (blocks only) - ~30 mins for 17M blocks
#   Phase 2: Switch to full handlers for complete transaction indexing
#   See docs/deployment.md for details

services:
  # ============================================
  # Selendra Full Node (Archive Mode)
  # Required for fast indexing (~170GB storage)
  # ============================================
  selendra-node:
    image: image.koompi.org/library/selendra-rpc:latest
    container_name: selendra-node
    restart: unless-stopped
    ports:
      - "9944:9944" # RPC (HTTP + WebSocket)
      - "30333:30333" # P2P
    volumes:
      - selendra-data:/data
    environment:
      - RUST_LOG=info
    command:
      - "--chain=selendra"
      - "--base-path=/data/selendradb"
      - "--name=selendra-terminal-node"
      - "--rpc-port=9944"
      - "--port=30333"
      - "--unsafe-rpc-external"
      - "--rpc-cors=all"
      - "--rpc-methods=unsafe"
      - "--rpc-max-connections=10000"
      - "--rpc-max-request-size=50"
      - "--rpc-max-response-size=50"
      - "--db-cache=4096"
      - "--no-mdns"
      - "--state-pruning=archive"
      - "--blocks-pruning=archive"
    healthcheck:
      test: [ "CMD", "curl", "-f", "-H", "Content-Type: application/json", "-d", '{"id":1,"jsonrpc":"2.0","method":"system_health","params":[]}', "http://localhost:9944" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - selendra-network

  # ============================================
  # PostgreSQL for SubQuery Indexer
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: selendra-indexer-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-subquery}
      POSTGRES_PASSWORD: ${DB_PASS:-subquery}
      POSTGRES_DB: ${DB_DATABASE:-subquery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-subquery}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selendra-network

  # ============================================
  # SubQuery Node - Indexes blockchain data
  # Connects to local Selendra node for fast sync
  # ============================================
  subquery-node:
    image: subquerynetwork/subql-node-substrate:latest
    container_name: selendra-indexer-node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      selendra-node:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-subquery}
      DB_PASS: ${DB_PASS:-subquery}
      DB_DATABASE: ${DB_DATABASE:-subquery}
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./indexer:/app
    command:
      - -f=/app
      - --db-schema=app
      - --workers=2
      - --batch-size=30
      - --log-level=info
      - --disable-historical=false
      - --network-endpoint=http://selendra-node:9944
      - --timeout=90000
      - --unfinalized-blocks=true
      - --store-flush-interval=30
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/ready" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - selendra-network

  # ============================================
  # SubQuery Query Service - GraphQL API
  # ============================================
  graphql-engine:
    image: subquerynetwork/subql-query:latest
    container_name: selendra-indexer-query
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      subquery-node:
        condition: service_started
    environment:
      DB_USER: ${DB_USER:-subquery}
      DB_PASS: ${DB_PASS:-subquery}
      DB_DATABASE: ${DB_DATABASE:-subquery}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: app
    command:
      - --name=app
      - --playground
      - --indexer=http://subquery-node:3000
    networks:
      - selendra-network

  # ============================================
  # Selendra Terminal Explorer
  # Connects to local node + GraphQL API
  # ============================================
  explorer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selendra-explorer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Local Selendra node (container-to-container networking)
      - NEXT_PUBLIC_SUBSTRATE_RPC_WS=ws://selendra-node:9944
      - NEXT_PUBLIC_SUBSTRATE_RPC_HTTP=http://selendra-node:9944
      - NEXT_PUBLIC_EVM_RPC_HTTP=http://selendra-node:9944
      # GraphQL API for indexed data
      - NEXT_PUBLIC_GRAPHQL_ENDPOINT=http://graphql-engine:3000/graphql
      - NEXT_PUBLIC_GRAPHQL_WS=ws://graphql-engine:3000/graphql
    depends_on:
      selendra-node:
        condition: service_healthy
      graphql-engine:
        condition: service_started
    networks:
      - selendra-network

  # ============================================
  # Explorer Standalone (Public RPC Only)
  # Use when you don't want to run local node
  # ============================================
  explorer-standalone:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selendra-explorer-standalone
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      # Public RPC endpoints
      - NEXT_PUBLIC_SUBSTRATE_RPC_WS=wss://rpc1.selendra.org
      - NEXT_PUBLIC_SUBSTRATE_RPC_HTTP=https://rpc.selendra.org
      - NEXT_PUBLIC_EVM_RPC_HTTP=https://rpc.selendra.org
    profiles:
      - standalone
    networks:
      - selendra-network

volumes:
  selendra-data:
    driver: local
  postgres_data:
    driver: local

networks:
  selendra-network:
    driver: bridge
