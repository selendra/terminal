# Selendra Terminal - Local Development with Local Node & Indexer
# This file is for local development/testing with a local Selendra node
#
# Usage:
#   docker-compose -f docker-compose.local.yml up -d
#
# Services:
#   - selendra-node: Local Selendra blockchain node
#   - postgres: PostgreSQL database for indexer
#   - subquery-node: SubQuery indexer node
#   - graphql-engine: SubQuery GraphQL API

services:
  # ============================================
  # Selendra Full Node (Local Development)
  # ============================================
  selendra-node:
    image: image.koompi.org/library/selendra-rpc:latest
    container_name: selendra-local-node
    restart: unless-stopped
    ports:
      - "9944:9944"   # WebSocket RPC
      - "9933:9933"   # HTTP RPC
      - "30333:30333" # P2P
    volumes:
      - selendra-local-data:/data
    environment:
      - RUST_LOG=info
    command:
      - "--chain=selendra"
      - "--base-path=/data/selendradb"
      - "--name=selendra-local-explorer"
      - "--rpc-port=9933"
      - "--port=30333"
      - "--rpc-external"
      - "--rpc-cors=all"
      - "--rpc-methods=unsafe"
      - "--rpc-max-connections=1000"
      - "--db-cache=2048"
      - "--no-mdns"
      # For faster sync in local dev, use warp sync
      - "--sync=warp"
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Content-Type: application/json", "-d", '{"id":1,"jsonrpc":"2.0","method":"system_health","params":[]}', "http://localhost:9933"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - selendra-local

  # ============================================
  # PostgreSQL for SubQuery Indexer
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: selendra-indexer-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: subquery
      POSTGRES_PASSWORD: subquery
      POSTGRES_DB: subquery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subquery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selendra-local

  # ============================================
  # SubQuery Node - Indexes blockchain data
  # ============================================
  subquery-node:
    image: subquerynetwork/subql-node-substrate:latest
    container_name: selendra-indexer-node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      selendra-node:
        condition: service_healthy
    environment:
      DB_USER: subquery
      DB_PASS: subquery
      DB_DATABASE: subquery
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./indexer:/app
    command:
      - -f=/app
      - --db-schema=app
      - --workers=4
      - --batch-size=30
      - --log-level=info
      - --disable-historical=false
      - --network-endpoint=ws://selendra-node:9944
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - selendra-local

  # ============================================
  # SubQuery Query Service - GraphQL API
  # ============================================
  graphql-engine:
    image: subquerynetwork/subql-query:latest
    container_name: selendra-indexer-query
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      subquery-node:
        condition: service_started
    environment:
      DB_USER: subquery
      DB_PASS: subquery
      DB_DATABASE: subquery
      DB_HOST: postgres
      DB_PORT: 5432
    command:
      - --name=selendra-unified-indexer
      - --playground
      - --indexer=http://subquery-node:3000
    networks:
      - selendra-local

volumes:
  selendra-local-data:
    driver: local
  postgres_data:
    driver: local

networks:
  selendra-local:
    driver: bridge
