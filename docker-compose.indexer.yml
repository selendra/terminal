# Selendra Terminal - Indexer Only (Public RPC)
# This file starts just the indexer services connecting to public RPC
#
# Usage:
#   docker compose -f docker-compose.indexer.yml up -d
#
# Services:
#   - postgres: PostgreSQL database for indexer
#   - subquery-node: SubQuery indexer node (connects to public RPC)
#   - graphql-engine: SubQuery GraphQL API

services:
  # ============================================
  # PostgreSQL for SubQuery Indexer
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: selendra-indexer-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: subquery
      POSTGRES_PASSWORD: subquery
      POSTGRES_DB: subquery
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./indexer/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subquery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selendra-indexer

  # ============================================
  # SubQuery Node - Indexes blockchain data
  # ============================================
  subquery-node:
    image: subquerynetwork/subql-node-substrate:latest
    container_name: selendra-indexer-node
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: subquery
      DB_PASS: subquery
      DB_DATABASE: subquery
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./indexer:/app
    command:
      - -f=/app
      - --db-schema=app
      - --workers=4
      - --batch-size=30
      - --log-level=info
      - --disable-historical=false
      # Connect to public Selendra RPC
      - --network-endpoint=wss://rpc.selendra.org
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - selendra-indexer

  # ============================================
  # SubQuery Query Service - GraphQL API
  # ============================================
  graphql-engine:
    image: subquerynetwork/subql-query:latest
    container_name: selendra-indexer-query
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      subquery-node:
        condition: service_healthy
    environment:
      DB_USER: subquery
      DB_PASS: subquery
      DB_DATABASE: subquery
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: app
    command:
      - --name=app
      - --playground
      - --indexer=http://subquery-node:3000
    networks:
      - selendra-indexer

volumes:
  postgres_data:
    driver: local

networks:
  selendra-indexer:
    driver: bridge
